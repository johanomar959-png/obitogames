<style>
  *{box-sizing:border-box}
  body{background:#0b0708;font-family:'Rubik',sans-serif;font-weight:500;overflow-x:hidden;color:#e5e7eb;margin:0}
  [class*="inset-0"]{top:0;right:0;bottom:0;left:0}
  [class*="inset-x-0"]{left:0;right:0}
  .bg-glow{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background:radial-gradient(700px circle at 15% -10%,rgba(220,38,38,.16),transparent 45%),radial-gradient(900px circle at 85% 0%,rgba(127,29,29,.10),transparent 45%);pointer-events:none}
  .glass{background:rgba(20,10,11,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .gradient-text{background:linear-gradient(135deg,#fca5a5,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  h2{font-weight:800;color:#f9fafb}
  .tile-img{transition:transform .3s ease;will-change:transform}
  .group:hover .tile-img{transform:scale(1.05)}
  .side-link{display:flex;align-items:center;gap:.75rem;width:100%;padding:.5rem .75rem;border-radius:.5rem;font-size:.92rem;font-weight:600;color:#d1d5db;transition:all .2s}
  .side-link:hover{background:rgba(220,38,38,.08);color:#fff}
  .side-link.active{background:rgba(220,38,38,.16);color:#fca5a5;box-shadow:inset 2px 0 0 #dc2626}
  .side-link.disabled{opacity:.4;cursor:not-allowed}
  .side-chip{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.8rem .5rem;border-radius:.75rem;background:rgba(255,255,255,.05);color:#e5e7eb;font-size:.85rem;font-weight:700;transition:all .2s}
  .side-chip:hover{background:rgba(220,38,38,.2);color:#fff;transform:translateY(-2px)}
  .tool-btn{display:flex;align-items:center;gap:.4rem;padding:.4rem .65rem;border-radius:.5rem;color:#d1d5db;font-size:.85rem;font-weight:700;transition:all .2s;cursor:pointer}
  .tool-btn:hover{background:rgba(220,38,38,.15);color:#fff}
  .tool-btn.on{color:#f87171}
  #stageWrap{position:relative;width:100%;padding-top:56.25%}
  .stage-portrait #stageWrap{padding-top:133%}
  .stage-tall #stageWrap{padding-top:155%}
  @supports (aspect-ratio:1/1){#stageWrap{padding-top:0;aspect-ratio:16/9}.stage-portrait #stageWrap{aspect-ratio:3/4}.stage-tall #stageWrap{aspect-ratio:9/14}}
  body.fs-active header,body.fs-active #sidebar,body.fs-active #sidebarBackdrop,body.fs-active #stageAd,body.fs-active #gameInfo,body.fs-active nav,body.fs-active aside.w-full.xl\:w-80,body.fs-active .glass.rounded-b-xl{display:none!important}
  body.fs-active main{padding-top:0!important}
  body.fs-active #stageBox{border-radius:0!important;position:fixed!important;top:0;left:0;right:0;bottom:0;width:100vw!important;height:100vh!important;z-index:9999;background:#000}
  body.fs-active #stageWrap{padding-top:0!important;aspect-ratio:auto!important;height:100%!important;max-height:100vh!important;width:100%!important}
  body.fs-active #stageInner{position:absolute!important;top:0;left:0;right:0;bottom:0}
  body.fs-active #exitFsBtn{position:fixed;top:10px;right:10px;z-index:10000;background:rgba(220,38,38,.9);color:#fff;padding:.6rem 1rem;border-radius:.5rem;font-weight:700;border:none;cursor:pointer}
  @keyframes tiltPhone{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(80deg)}}
  .tilt-anim{animation:tiltPhone 1.8s ease-in-out infinite}
  .lazy-row{content-visibility:auto;contain-intrinsic-size:0 15rem}
  .row-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:2.75rem;height:2.75rem;border-radius:9999px;background:rgba(15,8,8,.88);border:1px solid rgba(248,113,113,.25);display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:all .2s;cursor:pointer}
  .group\/row:hover .row-arrow,.row-arrow:focus-visible{opacity:1}
  .row-arrow:hover{background:#dc2626}
  @media (hover:none){.row-arrow{opacity:.85}}
  .skeleton{background:linear-gradient(90deg,#1a1010 25%,#251414 50%,#1a1010 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  *{-webkit-tap-highlight-color:transparent}
  .row-track,#browseGrid{contain:layout style paint}
  .tab-btn{padding:.5rem 1rem;border-radius:.5rem;font-size:.85rem;font-weight:700;color:#9ca3af;transition:all .2s;cursor:pointer;border:none;background:transparent}
  .tab-btn.active{color:#fca5a5;background:rgba(220,38,38,.15)}

</style>

            <p class="font-extrabold text-lg">Gira tu móvil para jugar</p>

        </div>

        <nav class="text-xs text-gray-400 mt-3 flex gap-1.5 flex-wrap"><button id="crumbHome">Juegos</button> »<button id="crumbCat"></button> »<span id="crumbTitle" class="text-gray-200"></span></nav>

    </div>
  </div>
  <footer class="px-6 py-8 border-t border-red-900/30 text-center text-sm text-gray-500">© 2026 Obito Games</footer>
</main>

<div id="misJuegosModal" class="modal-backdrop hidden"><div class="glass w-full max-w-md rounded-2xl p-6 max-h-[80vh] overflow-y-auto">

<div id="loginModal" class="modal-backdrop hidden"><div class="glass w-full max-w-sm rounded-2xl p-6 flex flex-col gap-4 max-h-[92vh] overflow-y-auto">

var PERF={DEBOUNCE_SEARCH:250};
function $(s){return document.querySelector(s);}
var state={category:null,search:'',current:null,view:'home',muted:false};
var CATS=[],CUR=[],lastRoute=null,sidebarOpen=false,seenGames=new Map();
var homeOffset=0,homeTotal=0,homeLoading=false,homeDone=false;

var BANDS=[
 {key:'A',emoji:'🃏',title:'Clásicos atemporales',sub:'Nostalgia pura',grad:'from-purple-950/70 via-[#170b1d] to-[#120714]',cat:'arcade'},
 {key:'B',emoji:'💎',title:'Combina y fusiona',sub:'Fácil empezar',grad:'from-emerald-950/70 via-[#0b1a12] to-[#07140c]',cat:'puzzle'},

var VirtualScroller={rows:[],visibleRange:[0,0],
 addRow:function(d,e,c){var id=this.rows.length;this.rows.push({id:id,data:d,element:e,tileCls:c||'w-64 h-40 shrink-0',visible:false,filled:false});return id;},
 updateVisibility:function(){var st=window.scrollY||0,vh=window.innerHeight,b=vh*.5,s=-1,e=-1;for(var i=0;i<this.rows.length;i++){var r=this.rows[i];if(!r.element)continue;var rc=r.element.getBoundingClientRect(),top=rc.top+st,bot=top+rc.height;var inV=bot>st-b&&top<st+vh+b;if(inV){if(s===-1)s=i;e=i;if(!r.visible){r.element.style.contentVisibility='visible';r.visible=true;}}else if(r.visible){r.element.style.contentVisibility='auto';r.visible=false;}}this.visibleRange=[s,e];},

 fillRow:function(r){if(r.filled)return;r.filled=true;var t=r.element.querySelector('.row-track');if(!t)return;t.innerHTML=r.data.map(function(g){return tileHTML(g,r.tileCls);}).join('');t.dataset.filled='1';},
 reset:function(){this.rows=[];this.visibleRange=[0,0];}};

function cycleSource(){clearTimeout(stageState.timer);clearInterval(stageState.tick);var s=stageState;if(s.idx+1<s.sources.length){loadSource(s.idx+1);return;}if(s.alts&&s.alts.length){var alt=s.alts.shift();state.current=Object.assign({},state.current,{id:alt.id,title:alt.title,sources:alt.sources,embed_url:alt.embed_url,play_url:alt.play_url});seenGames.set(alt.id,state.current);s.sources=(alt.sources&&alt.sources.length)?alt.sources:[alt.embed_url].filter(Boolean);s.idx=0;$('#tbTitle').textContent=state.current.title;if(s.sources.length)loadSource(0);else stageShow('No responde 😢',true);return;}stageShow('No responde 😢',true);}

function showLauncher(g){state.current=g;soundOn=true;state.muted=false;showView('game');stopStage();clearOverlayBg();stageHide();var logo=logoURL(g)||'';$('#stageInner').innerHTML='<div class="absolute inset-0 flex flex-col items-center justify-center gap-4 text-center p-6" style="'+(logo?'background:linear-gradient(rgba(11,7,8,.86),rgba(11,7,8,.86)), url('+logo+') center/cover;':'')+'"><h2 class="text-2xl font-extrabold">'+Security.escapeHtml(g.title)+'</h2><a href="'+(Security.sanitizeUrl(g.play_url)||'#')+'" target="_blank" rel="noopener" class="px-6 py-3 rounded-xl bg-red-600 font-bold">🎮 Jugar en sitio oficial</a></div>';finishGameView(g);}
function finishGameView(g){var logo=logoURL(g);var tb=$('#tbEmoji');tb.className='w-8 h-8 rounded-lg bg-gradient-to-br '+g.gradient+' flex items-center justify-center text-lg shrink-0 overflow-hidden';tb.innerHTML=logo?'<img src="'+logo+'" class="w-6 h-6 object-contain">':Security.escapeHtml(g.emoji);$('#tbTitle').textContent=g.title;refreshToolbar();var cat=null;for(var i=0;i<CATS.length;i++)if(CATS[i].slug===g.category)cat=CATS[i];$('#crumbCat').textContent=cat?cat.name:g.category;$('#crumbTitle').textContent=g.title;$('#stageAd').innerHTML=adBanner();$('#railAd').innerHTML=adBanner();$('#gameInfo').innerHTML=gameInfoHTML(g);loadRail(g);applyOrientation();window.scrollTo(0,0);}
function loadRail(g){var total=homeTotal||38000;var off=(railCounter*RAIL_SIZE)%Math.max(1,total-RAIL_SIZE);railCounter++;api('/api/games',{category:g?g.category:'',limit:12}).then(function(same){var list=(same.games||[]).filter(function(x){return !g||x.id!==g.id;});if(list.length<RAIL_SIZE)return api('/api/games',{limit:RAIL_SIZE,offset:off}).then(function(win){(win.games||[]).forEach(function(x){if(list.length<RAIL_SIZE&&(!g||x.id!==g.id)&&!list.some(function(o){return o.id===x.id;}))list.push(x);});return list;});return list;}).catch(function(){return [];}).then(function(list){railQueue=list.slice(0,RAIL_SIZE);railShown=0;$('#nextGames').innerHTML='';appendRail();});}
function appendRail(){var slice=railQueue.slice(railShown,railShown+12);$('#nextGames').insertAdjacentHTML('beforeend',slice.map(function(x){return nextTile(x);}).join(''));railShown+=slice.length;}
function showView(n){if(state.view==='game'&&n!=='game'){stopStage();clearOverlayBg();var h=$('#rotateHint');if(h)h.classList.add('hidden');var b=$('#stageBox');if(b){b.classList.remove('stage-portrait');b.classList.remove('stage-tall');}state.muted=false;soundOn=true;}state.view=n;$('#homeView').classList.toggle('hidden',n!=='home');$('#browseView').classList.toggle('hidden',n!=='browse');$('#gameView').classList.toggle('hidden',n!=='game');}
function openGame(id){var gid=Security.validateGameId(id);if(!gid){toast('ID inválido');return;}var g=seenGames.get(gid);var done=function(gg){var sources=(gg.sources||[]).map(function(u){return (u&&u.charAt(0)==='/')?u:Security.sanitizeUrl(u);}).filter(Boolean);if(!sources.length||gg.blocked){showLauncher(gg);return;}state.current=gg;soundOn=true;state.muted=false;showView('game');var rec=store.get('obito_recent_games',[]);var mini={id:gg.id,title:gg.title,emoji:gg.emoji,gradient:gg.gradient,logo:gg.logo,category:gg.category,embed_url:sources[0],play_url:gg.play_url,active_players:gg.active_players};var ix=-1;for(var i=0;i<rec.length;i++)if(String(rec[i].id)===String(gg.id)){ix=i;break;}if(ix>-1)rec.splice(ix,1);rec.unshift(mini);store.set('obito_recent_games',rec.slice(0,12));stageState.sources=sources;stageState.alts=(gg.__alts||[]).map(function(a){return{id:a.id,title:a.title,sources:(a.sources||[]).map(function(u){return Security.sanitizeUrl(u);}).filter(Boolean),embed_url:Security.sanitizeUrl(a.embed_url),play_url:a.play_url};});stageState.idx=0;loadSource(0);finishGameView(gg);};
 if(g){done(g);return;}
 if(String(gid).indexOf('c')===0){api('/api/curated',{}).then(function(d){var f=null;(d.games||[]).forEach(function(x){if(x.id===gid)f=x;});if(!f){toast('No encontrado');return;}seenGames.set(gid,f);done(f);});}
 else{api('/api/game/'+gid,{}).then(function(d){var gg=d.game;gg.__alts=d.alternativas;seenGames.set(gid,gg);done(gg);}).catch(function(){toast('Error');});}}
function refreshToolbar(){var g=state.current;if(!g)return;var liked=!!likesMap[g.id];$('#likeBtn').innerHTML=icon('thumbup','w-4 h-4')+' <span>'+fmt(g.likes+(liked?1:0))+'</span>';$('#likeBtn').classList.toggle('on',liked);$('#dislikeBtn').innerHTML=icon('thumbdown','w-4 h-4');$('#favBtn').innerHTML=icon('bookmark','w-4 h-4',!!favsMap[g.id]);$('#favBtn').classList.toggle('on',!!favsMap[g.id]);$('#comBtn').innerHTML=icon('comment','w-4 h-4');$('#shareBtn').innerHTML=icon('share','w-4 h-4');$('#soundBtn').innerHTML=icon(state.muted?'volumeX':'volume','w-4 h-4');$('#soundBtn').classList.toggle('on',state.muted);$('#reportBtn').innerHTML=icon('flag','w-4 h-4');$('#tabBtn').innerHTML=icon('external','w-4 h-4');$('#fsBtn').innerHTML=icon('maximize','w-4 h-4');}
function renderSidebar(cats){var m='';MAIN_NAV.forEach(function(n){m+='<button class="side-link" data-nav="'+n.id+'" '+(n.section?'data-section="'+n.section+'"':'')+' data-label="'+Security.escapeHtml(n.label)+'">'+icon(n.icon)+'<span class="truncate">'+Security.escapeHtml(n.label)+'</span></button>';});$('#mainNav').innerHTML=m;var c='';cats.forEach(function(cc){c+='<button class="side-link" data-category="'+Security.escapeHtml(cc.slug)+'" data-label="'+Security.escapeHtml(cc.name)+'" data-icon="'+Security.escapeHtml(cc.icon)+'">'+icon(cc.icon)+'<span class="truncate">'+Security.escapeHtml(cc.name)+'</span></button>';});$('#categoryNav').innerHTML=c;}
function setActive(btn){document.querySelectorAll('.side-link').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');}
function setSidebar(open){sidebarOpen=open;$('#sidebar').classList.toggle('-translate-x-full',!open);$('#mainCol').classList.toggle('lg:pl-60',open);$('#sidebarBackdrop').classList.toggle('hidden',!(open&&window.innerWidth<1024));}
function route(){var h=location.hash,key=h||'#home';if(key===lastRoute)return;lastRoute=key;var m;if((m=h.match(/^#juego-([A-Za-z0-9_-]{1,128})$/))){openGame(m[1]);return;}if((m=h.match(/^#cat-([a-z-]+)$/))){state.category=m[1];state.search='';$('#searchInput').value='';loadBrowse(document.querySelector('.side-link[data-category="'+m[1]+'"]'));return;}if((m=h.match(/^#sec-([a-z]+)$/))){var n=null;MAIN_NAV.forEach(function(x){if(x.section===m[1])n=x;});loadSection(m[1],n?n.label:'Juegos',document.querySelector('[data-section="'+m[1]+'"]'));return;}loadHome(null);}
function goHash(h){if(h){if(location.hash!==h)location.hash=h;else{lastRoute=null;route();}}else{history.pushState(null,'',location.pathname+location.search);lastRoute=null;route();}}
window.addEventListener('hashchange',route);window.addEventListener('popstate',function(){lastRoute=null;route();});
window.addEventListener('resize',function(){if(window.innerWidth>=1024)$('#sidebarBackdrop').classList.add('hidden');else if(sidebarOpen)$('#sidebarBackdrop').classList.remove('hidden');applyOrientation();});
window.addEventListener('orientationchange',function(){setTimeout(applyOrientation,150);});
function enterFullscreen(){var b=$('#stageBox');document.body.classList.add('fs-active');var btn=document.createElement('button');btn.id='exitFsBtn';btn.textContent='✕ Salir';btn.onclick=exitFullscreen;document.body.appendChild(btn);if(b.requestFullscreen)b.requestFullscreen().catch(function(){});else if(b.webkitRequestFullscreen)b.webkitRequestFullscreen();}
function exitFullscreen(){document.body.classList.remove('fs-active');var b=document.getElementById('exitFsBtn');if(b)b.parentNode.removeChild(b);if(document.exitFullscreen)document.exitFullscreen().catch(function(){});else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&!document.body.classList.contains('fs-active'))return;if(!document.fullscreenElement)exitFullscreen();});
document.addEventListener('click',function(e){
 var arrow=e.target.closest?e.target.closest('.row-arrow'):null;
 if(arrow){var track=arrow.parentElement.querySelector('.row-track');if(track){if(!track.dataset.filled){var sec=arrow.closest('section[data-row]');if(sec){var row=VirtualScroller.rows[+sec.dataset.row];if(row&&!row.filled)VirtualScroller.fillRow(row);}}track.scrollBy({left:track.clientWidth*0.85*(+arrow.dataset.dir),behavior:'smooth'});}return;}
 var chip=e.target.closest?e.target.closest('.side-chip'):null;if(chip){goHash('#cat-'+chip.dataset.category);return;}
 var play=e.target.closest?e.target.closest('[data-play]'):null;if(play){e.preventDefault();goHash('#juego-'+play.dataset.play);return;}
 var side=e.target.closest?e.target.closest('.side-link'):null;
 if(side&&!side.dataset.disabled){if(side.dataset.nav==='home')goHash('');else if(side.dataset.section)goHash('#sec-'+side.dataset.section);else if(side.dataset.category)goHash('#cat-'+side.dataset.category);if(window.innerWidth<1024)setSidebar(false);}});
function bindEvents(){
 $('#menuBtn').addEventListener('click',function(){setSidebar(!sidebarOpen);});
 $('#sidebarBackdrop').addEventListener('click',function(){setSidebar(false);});
 $('#searchInput').addEventListener('input',function(e){debouncedSearch(e.target.value);});
 var hb=document.querySelector('header [data-nav="home"]');if(hb)hb.addEventListener('click',function(){goHash('');});
 $('#likeBtn').addEventListener('click',function(){var g=state.current;if(!g)return;likesMap[g.id]=!likesMap[g.id];store.set('obito_likes',likesMap);refreshToolbar();toast(likesMap[g.id]?'👍 Te gusta':'Like retirado');});
 $('#dislikeBtn').addEventListener('click',function(){var g=state.current;if(!g)return;if(likesMap[g.id]){delete likesMap[g.id];store.set('obito_likes',likesMap);refreshToolbar();}toast('😕 Notado');});
 $('#favBtn').addEventListener('click',function(){var g=state.current;if(!g)return;favsMap[g.id]=!favsMap[g.id];store.set('obito_favs',favsMap);refreshToolbar();toast(favsMap[g.id]?'🔖 Guardado':'Eliminado');});
 $('#misJuegosBtn').addEventListener('click',function(){openMisJuegos('guardados');});
 function openMisJuegos(tab){$('#misJuegosModal').classList.remove('hidden');$('#misJuegosModal').classList.add('flex');renderMisJuegos(tab||'guardados');}
 document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');renderMisJuegos(b.dataset.tab);});});
 function findGame(id){var sid=String(id);if(seenGames.has(sid))return seenGames.get(sid);for(var i=0;i<CUR.length;i++)if(String(CUR[i].id)===sid)return CUR[i];var rec=store.get('obito_recent_games',[])||[];for(var j=0;j<rec.length;j++)if(String(rec[j].id)===sid)return rec[j];return null;}
 function renderMisJuegos(tab){var cont=$('#misJuegosContent');var list=[];if(tab==='guardados')list=Object.keys(favsMap).filter(function(id){return favsMap[id];});else if(tab==='likes')list=Object.keys(likesMap).filter(function(id){return likesMap[id];});else list=(store.get('obito_recent_games',[])||[]).map(function(g){return g.id;});var games=list.map(findGame).filter(Boolean);if(!games.length){cont.innerHTML='<p class="text-center text-gray-500 py-8 text-sm">Vacío</p>';return;}cont.innerHTML=games.map(function(g){var logo=logoURL(g);return '<div class="modal-game-item" data-play="'+g.id+'">'+(logo?'<img src="'+logo+'" class="modal-game-thumb">':'<div class="modal-game-thumb flex items-center justify-center text-xl">'+Security.escapeHtml(g.emoji||'🎮')+'</div>')+'<div class="flex-1 min-w-0"><p class="font-bold text-sm truncate">'+Security.escapeHtml(g.title)+'</p></div><span class="text-red-400 text-xs font-bold">JUGAR ▶</span></div>';}).join('');cont.querySelectorAll('[data-play]').forEach(function(el){el.addEventListener('click',function(){$('#misJuegosModal').classList.add('hidden');$('#misJuegosModal').classList.remove('flex');goHash('#juego-'+el.dataset.play);});});}
 $('#closeMisJuegos').addEventListener('click',function(){$('#misJuegosModal').classList.add('hidden');$('#misJuegosModal').classList.remove('flex');});
 $('#comBtn').addEventListener('click',function(){$('#comentariosModal').classList.remove('hidden');$('#comentariosModal').classList.add('flex');renderComentarios();});
 function renderComentarios(){var g=state.current;if(!g)return;var coms=store.get('obito_com_'+g.id,[]);var cont=$('#comentariosList');if(!coms.length){cont.innerHTML='<p class="text-center text-gray-500 py-4 text-sm">Sé el primero.</p>';return;}cont.innerHTML=coms.map(function(c){return '<div class="p-3 rounded-xl bg-white/5"><p class="text-xs text-gray-500 mb-1">'+new Date(c.ts).toLocaleString('es')+'</p><p class="text-sm text-gray-200">'+Security.escapeHtml(c.text)+'</p></div>';}).join('');}
 $('#enviarComentario').addEventListener('click',function(){var g=state.current;if(!g)return;var inp=$('#comentarioInput');var t=inp.value.trim();if(!t)return;var k='obito_com_'+g.id;var c=store.get(k,[]);c.unshift({text:t,ts:Date.now()});store.set(k,c.slice(0,50));inp.value='';renderComentarios();toast('💬 Enviado');});
 $('#closeComentarios').addEventListener('click',function(){$('#comentariosModal').classList.add('hidden');$('#comentariosModal').classList.remove('flex');});
 $('#shareBtn').addEventListener('click',function(){var u=location.href;if(navigator.share){navigator.share({title:'Obito Games',url:u}).catch(function(){});}else{try{navigator.clipboard.writeText(u).then(function(){toast('🔗 Copiado');});}catch(e){toast('Copia el enlace');}}});
 $('#soundBtn').addEventListener('click',function(){state.muted=!state.muted;soundOn=!state.muted;var ok=setGameMuted(state.muted);refreshToolbar();toast(state.muted?(ok?'🔇 Silenciado':'🔇 Silencio'):'🔊 Sonido');});
 $('#reportBtn').addEventListener('click',function(){$('#reportarModal').classList.remove('hidden');$('#reportarModal').classList.add('flex');});
 document.querySelectorAll('.report-reason').forEach(function(b){b.addEventListener('click',function(){$('#reportarModal').classList.add('hidden');$('#reportarModal').classList.remove('flex');toast('🚩 Reportado');});});
 $('#closeReportar').addEventListener('click',function(){$('#reportarModal').classList.add('hidden');$('#reportarModal').classList.remove('flex');});
 $('#fsBtn').addEventListener('click',function(){if(!document.body.classList.contains('fs-active'))enterFullscreen();else exitFullscreen();});
 $('#tabBtn').addEventListener('click',function(){if(state.current&&state.current.play_url)window.open(state.current.play_url,'_blank','noopener');});
 $('#amigosBtn').addEventListener('click',function(){$('#amigosModal').classList.remove('hidden');$('#amigosModal').classList.add('flex');$('#friendCode').textContent=genCode();renderFriends();});
 function genCode(){var c=store.get('obito_friend_code',null);if(!c){c='OB-'+Math.random().toString(36).substr(2,6).toUpperCase();store.set('obito_friend_code',c);}return c;}
 function renderFriends(){var fr=store.get('obito_friends',[]);var cont=$('#friendsList');if(!fr.length){cont.innerHTML='<p class="text-center text-gray-500 py-4 text-sm">Sin amigos aún</p>';return;}cont.innerHTML=fr.map(function(f){return '<div class="flex justify-between p-3 rounded-xl bg-white/5"><span class="text-sm font-bold">'+Security.escapeHtml(f.code)+'</span><button class="text-xs text-red-400" data-remove="'+Security.escapeHtml(f.code)+'">Eliminar</button></div>';}).join('');cont.querySelectorAll('[data-remove]').forEach(function(b){b.addEventListener('click',function(){var nf=store.get('obito_friends',[]).filter(function(f){return f.code!==b.dataset.remove;});store.set('obito_friends',nf);renderFriends();});});}
 $('#copyFriendCode').addEventListener('click',function(){try{navigator.clipboard.writeText($('#friendCode').textContent).then(function(){toast('📋 Copiado');});}catch(e){}});
 $('#addFriendBtn').addEventListener('click',function(){var inp=$('#addFriendInput');var c=inp.value.trim().toUpperCase();if(!c||c===genCode()){toast('Inválido');return;}var fr=store.get('obito_friends',[]);var ex=false;fr.forEach(function(f){if(f.code===c)ex=true;});if(ex){toast('Ya amigo');return;}fr.push({code:c,ts:Date.now()});store.set('obito_friends',fr);inp.value='';renderFriends();toast('✅ Agregado');});
 $('#closeAmigos').addEventListener('click',function(){$('#amigosModal').classList.add('hidden');$('#amigosModal').classList.remove('flex');});
 document.querySelectorAll('.modal-backdrop').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m){m.classList.add('hidden');m.classList.remove('flex');}});});
 $('#crumbHome').addEventListener('click',function(){goHash('');});
 $('#crumbCat').addEventListener('click',function(){if(state.current)goHash('#cat-'+state.current.category);});
 $('#failRetry').addEventListener('click',function(){loadSource(0);});
 $('#failOpen').addEventListener('click',function(){var u=stageState.currentUrl||(state.current&&state.current.play_url);if(u)window.open(u,'_blank','noopener');});
 window.addEventListener('scroll',onScroll,{passive:true});
 if('IntersectionObserver' in window){
  new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting&&!$('#homeView').classList.contains('hidden'))fetchHomeBatch();});},{rootMargin:'900px 0px'}).observe($('#homeSentinel'));
  new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting&&!$('#browseView').classList.contains('hidden'))appendBrowse();});},{rootMargin:'700px 0px'}).observe($('#browseSentinel'));
  new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting&&railShown<railQueue.length)appendRail();});},{rootMargin:'600px 0px'}).observe($('#railSentinel'));
 }}
function init(){Promise.all([api('/api/categories',{}),api('/api/curated',{})]).then(function(res){CATS=res[0].categories||[];CUR=res[1].games||[];renderSidebar(CATS);bindEvents();route();}).catch(function(){$('#homeRows').innerHTML='<p class="text-red-400">Error</p>';});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
